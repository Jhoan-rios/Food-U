{% extends "base.html" %}
{% block titulo %}Mi tienda{% endblock %}
{% block contenido %}
<div class="contenedor">
  <div class="fila" style="margin-bottom:2rem; align-items:flex-start;">
    <div>
      <h1>{{ vendedor.nombre }}</h1>
      <p class="subtitulo">⭐ {{ "%.1f"|format(vendedor.calificacion) if vendedor.calificacion > 0 else "Sin calificaciones aún" }}</p>
    </div>
    <a href="{{ url_for('agregar_producto') }}" class="btn btn-primary" style="width:auto;">+ Agregar producto</a>
  </div>
</div>
{% endblock %}
