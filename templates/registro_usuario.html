{% extends "base.html" %}
{% block titulo %}Registro{% endblock %}
{% block contenido %}
<div class="contenedor-sm">
  <h1>Crea tu cuenta</h1>
    <p class="subtitulo">Regístrate para pedir comida en el campus</p>
    <div class="card">
    <form method="POST">
        <div class="campo">
            <label>Nombre de usuario</label>
            <input type="text" name="nombre" placeholder="Tu nombre" required>
        </div>
        <div class="campo">
            <label>Correo electrónico</label>
            <input type="email" name="correo" placeholder="usuario@udem.edu.co" required>
        </div>
        <div class="campo">
            <label>Tiempo disponible (minutos)</label>
            <input type="number" name="tiempo" placeholder="Ej: 30" min="1" required>
        </div>
        <div class="campo">
            <label>Contraseña (mínimo 4 caracteres)</label>
            <input type="password" name="contrasena" placeholder="••••••••" required minlength="4">
        </div>
        <button type="submit" class="btn btn-primary">Crear cuenta</button>
    </form>
    </div>
</div>
{% endblock %}
