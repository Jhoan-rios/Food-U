{% extends "base.html" %}
{% block titulo %}Agregar producto{% endblock %}
{% block contenido %}
<div class="contenedor-sm">
  <h1>Nuevo producto</h1>
  <p class="subtitulo">Agrega un plato a tu menú</p>

  <div class="card">
    <form method="POST">
      <div class="campo">
        <label>Nombre del producto</label>
        <input type="text" name="nombre" placeholder="Ej: Bandeja paisa" required>
      </div>
      <div class="campo">
        <label>Precio ($)</label>
        <input type="number" name="precio" placeholder="Ej: 12000" step="0.01" min="0" required>
      </div>
    </form>
  </div>

  <div style="margin-top:1rem; text-align:center;">
    <a href="{{ url_for('dashboard_vendedor') }}" class="texto-gris" style="font-size:0.9rem; text-decoration:none;">← Volver a mi tienda</a>
  </div>
</div>
{% endblock %}
