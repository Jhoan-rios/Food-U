{% extends "base.html" %}
{% block titulo %}Registro vendedor{% endblock %}
{% block contenido %}
<div class="contenedor-sm">
    <div style="margin-top:2rem;">
  <h1>Registrar local</h1>
    <p class="subtitulo">Empieza a vender en el campus</p>

    <div class="card">
        <form method="POST">
            <div class="campo">
                <label>Nombre del local</label>
                <input type="text" name="nombre" placeholder="Ej: Fritanga de Juan" required>
            </div>
            <div class="campo">
                <label>Contraseña (mínimo 4 caracteres)</label>
                <input type="password" name="contrasena" placeholder="••••••••" required minlength="4">
            </div>

            <button type="submit" class="btn btn-primary">Crear local</button>



        </form>
    </div>
    <p class="texto-centro texto-gris" style="margin-top:1rem; font-size:0.9rem;">
        ¿Ya tienes cuenta?
        <a href="{{ url_for('login_vendedor') }}" class="texto-naranja" style="text-decoration:none; font-weight:500;">Inicia sesión</a>
    </p>
    </div>
    </div>

{% endblock %}
