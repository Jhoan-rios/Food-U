<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodU – {% block titulo %}{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --naranja: #FF5C00;
      --naranja-claro: #FF8C42;
      --crema: #FFF8F2;
      --oscuro: #1A1008;
      --gris: #6B6560;
      --borde: #E8DED5;
      --verde: #2D6A4F;
      --rojo: #C1121F;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--crema);
      color: var(--oscuro);
      min-height: 100vh;

     }
    nav {
      background: var(--oscuro);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.4rem;
      color: var(--naranja);
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .nav-logo span { color: white; }
    .nav-links { display: flex; gap: 0.5rem; align-items: center; }
    .nav-links a {
      color: #ccc;
      text-decoration: none;
      font-size: 0.875rem;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      transition: all 0.15s;
    }
    .nav-links a:hover { background: rgba(255,255,255,0.1); color: white; }
    .nav-links .btn-nav {
      background: var(--naranja);
      color: white !important;
      font-weight: 500;
    }
    .nav-links .btn-nav:hover { background: var(--naranja-claro); }
  </style>

</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}" class="nav-logo">Food<span>U</span></a>
     <div class="nav-links">
      {% if session.get('usuario') %}
        <a href="{{ url_for('dashboard_usuario') }}">Mi cuenta</a>
        <a href="{{ url_for('menu_productos') }}">Menú</a>
        <a href="{{ url_for('crear_pedido') }}">Pedir</a>
        <a href="{{ url_for('historial_usuario') }}">Historial</a>
        <a href="{{ url_for('logout_usuario') }}" class="btn-nav">Salir</a>
      {% elif session.get('vendedor') %}
        <a href="{{ url_for('dashboard_vendedor') }}">Mi tienda</a>
        <a href="{{ url_for('gestionar_pedidos') }}">Pedidos</a>
        <a href="{{ url_for('logout_vendedor') }}" class="btn-nav">Salir</a>
      {% else %}
        <a href="{{ url_for('login_usuario') }}">Soy cliente</a>
        <a href="{{ url_for('login_vendedor') }}" class="btn-nav">Soy vendedor</a>
      {% endif %}
    </div>
  </nav>
  {% block contenido %}{% endblock %}
</body>
</html>
